name: 木曜11時 下書きをつくる

# GitHub の時計は世界標準時（UTC）です。日本時間から9時間引きます。
#
# ★ 定時実行は、GitHub が混んでいると遅れます。飛ばされることもあります。
#   2026-09-18 に実際に確かめました（木曜の分が5時間28分おくれ、金曜の分は飛びました）。
#   毎時00分がいちばん混むので避け、時刻をずらして何回か起こしています。
#   下書きは何回作っても同じものになるので、そのまま何回か起こしています。
on:
  schedule:
    - cron: "3 2 * * 4"    # 木 11:03
    - cron: "33 2 * * 4"   # 木 11:33
    - cron: "7 3 * * 4"    # 木 12:07
    - cron: "11 6 * * 4"   # 木 15:11
  workflow_dispatch:        # 手で動かしたいときのボタン

permissions:
  contents: write           # 下書きを記録として残すため
  issues: write             # 承認をお願いする Issue を立てるため

jobs:
  draft:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo          # GitHub の中は世界標準時です。日本時間に合わせます
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 次回の水曜とメンバーを決めて、告知文を組み立てる
        id: build
        run: python3 scripts/build_draft.py --show

      # Instagram は画像を公開URLから取りに行きます。だから GitHub に置きます。
      - name: 開催日とホスト名を焼き込んだ画像をつくる
        run: |
          python3 -m pip install --quiet Pillow
          python3 scripts/make_images.py --draft "${{ steps.build.outputs.draft }}"
          # 当日（水曜の朝）に出す分も、いまのうちに作っておきます。
          # 先に GitHub へ置いておけば、当日は出すだけで済みます。
          python3 scripts/make_images.py --draft "${{ steps.build.outputs.draft }}" --on-the-day

      - name: 下書きと画像を記録として残す
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drafts/ images/weekly/
          git diff --staged --quiet || git commit -m "下書き ${{ steps.build.outputs.draft }}"
          git push

      - name: 承認をお願いする Issue を立てる
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/github_issue.py open --draft "${{ steps.build.outputs.draft }}"
